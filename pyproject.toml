[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophthalmotwin_gp"
version = "0.1.0"
description = "Dual-stream genotype-phenotype digital twin for inherited retinal dystrophies with conformal coverage"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "ConfigArgParse>=1.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "isort",
    "mypy",
    "pytest",
    "pre-commit",
    "scikit-learn>=1.3",
]
backbone = [
    "timm>=1.0",
]

[project.scripts]
ophthalmotwin-gp = "ophthalmotwin_gp.studio:main"

[tool.setuptools.packages.find]
include = ["ophthalmotwin_gp*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ophthalmotwin_gp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ophthalmotwin_gp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
ignore_missing_imports = true
files = ["ophthalmotwin_gp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
